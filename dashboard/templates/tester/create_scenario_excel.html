{% extends "base_dashboard.html" %}
{% load static %}

{% block content %}
<!-- Bootstrap Icons are already in base, so no extra link needed -->

<style>
  /* Page header – matches dashboard */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 1.5rem 0 2rem 0;
  }
  .page-title {
    font-size: 2rem;
    font-weight: 700;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .page-title i {
    color: #f97316;
    font-size: 2rem;
    background: white;
    padding: 0.5rem;
    border-radius: 18px;
    box-shadow: 0 4px 12px rgba(249,115,22,0.2);
  }

  /* Card styling – matches other pages */
  .entry-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.02);
    overflow: hidden;
  }
  .card-header-custom {
    padding: 1.5rem 2rem;
    background: white;
    border-bottom: 1px solid #f1f4f8;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-header-custom h4 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #0f172a;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .card-header-custom h4 i {
    color: #f97316;
    background: rgba(249,115,22,0.1);
    padding: 0.5rem;
    border-radius: 14px;
  }

  /* Buttons */
  .btn-outline-orange {
    border: 1px solid #f97316;
    color: #f97316;
    background: transparent;
    border-radius: 40px;
    padding: 0.5rem 1.5rem;
    font-weight: 500;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-outline-orange:hover {
    background: #f97316;
    color: white;
  }
  .btn-orange {
    background: #f97316;
    color: white;
    border: none;
    border-radius: 40px;
    padding: 0.5rem 2rem;
    font-weight: 500;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-orange:hover {
    background: #e36209;
  }
  .btn-secondary-custom {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #e2e8f0;
    border-radius: 40px;
    padding: 0.5rem 1.8rem;
    font-weight: 500;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-secondary-custom:hover {
    background: #e2e8f0;
  }

  /* Table styling */
  .table-responsive {
    overflow-x: auto;
    padding: 0 1.5rem 1.5rem;
  }
  .table {
    margin-bottom: 0;
    min-width: 900px;
  }
  .table thead th {
    background: #f8fafc;
    color: #0f172a;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid #e2e8f0;
    padding: 1rem;
  }
  .table td {
    padding: 0.75rem;
    vertical-align: middle;
    border-color: #e2e8f0;
  }
  .table input, .table select {
    font-size: 0.9rem;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    padding: 0.6rem 1rem;
    width: 100%;
    transition: border 0.2s;
  }
  .table input:focus, .table select:focus {
    border-color: #f97316;
    outline: none;
    box-shadow: 0 0 0 3px rgba(249,115,22,0.1);
  }

  /* Remove button */
  .btn-remove {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fee2e2;
    color: #b91c1c;
    border: none;
    transition: all 0.2s;
  }
  .btn-remove:hover {
    background: #fecaca;
    color: #991b1b;
  }

  /* Footer actions */
  .form-actions {
    padding: 1.5rem 2rem;
    background: #f8fafc;
    border-top: 1px solid #f1f4f8;
    display: flex;
    gap: 1rem;
    align-items: center;
  }
</style>

<div class="container-fluid px-4">
  <!-- Header -->
  <div class="page-header">
    <h2 class="page-title">
      <i class="bi bi-flask"></i> {{ project.name }} – Add Scenarios
    </h2>
  </div>

  <!-- Entry Card -->
  <div class="entry-card">
    <div class="card-header-custom">
      <h4><i class="bi bi-pencil-fill"></i> Bulk Scenario Entry</h4>
      <button class="btn-outline-orange" onclick="addRow()">
        <i class="bi bi-plus-circle"></i> Add Row
      </button>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="table-responsive">
        <table class="table table-bordered" id="scenarioTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- Empty initial row -->
            <tr>
              <td><input type="text" name="title[]" class="form-control" placeholder="e.g., Login with valid credentials"></td>
              <td><input type="text" name="description[]" class="form-control" placeholder="Brief description"></td>
              <td>
                <select name="priority[]" class="form-select">
                  <option value="LOW">Low</option>
                  <option value="MEDIUM" selected>Medium</option>
                  <option value="HIGH">High</option>
                </select>
              </td>
              <td>
                <select name="status[]" class="form-select">
                  <option value="NEW" selected>New</option>
                  <option value="IN_REVIEW">In Review</option>
                  <option value="APPROVED">Approved</option>
                </select>
              </td>
              <td>
                <button type="button" class="btn-remove" onclick="this.closest('tr').remove()" title="Remove">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="submit" class="btn-orange">
          <i class="bi bi-save"></i> Save All Scenarios
        </button>
        <a href="{% url 'dashboard:tester_scenarios' project.id %}" class="btn-secondary-custom">
          <i class="bi bi-x"></i> Cancel
        </a>
        <small class="text-muted ms-auto">
          <i class="bi bi-keyboard"></i> Press <kbd>Enter</kbd> to add new row
        </small>
      </div>
    </form>
  </div>
</div>

<script>
  function addRow() {
    let table = document.getElementById("scenarioTable").getElementsByTagName('tbody')[0];
    let row = table.insertRow();

    row.innerHTML = `
      <td><input type="text" name="title[]" class="form-control" placeholder="e.g., Login with valid credentials"></td>
      <td><input type="text" name="description[]" class="form-control" placeholder="Brief description"></td>
      <td>
        <select name="priority[]" class="form-select">
          <option value="LOW">Low</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="HIGH">High</option>
        </select>
      </td>
      <td>
        <select name="status[]" class="form-select">
          <option value="NEW" selected>New</option>
          <option value="IN_REVIEW">In Review</option>
          <option value="APPROVED">Approved</option>
        </select>
      </td>
      <td>
        <button type="button" class="btn-remove" onclick="this.closest('tr').remove()" title="Remove">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    `;
  }

  // Enter key shortcut (prevents form submission, adds row)
  document.addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.target.matches('button, input[type="submit"], textarea')) {
      event.preventDefault();
      addRow();
    }
  });
</script>

{% endblock %}
