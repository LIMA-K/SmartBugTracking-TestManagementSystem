{% extends "base_dashboard.html" %}
{% load static %}

{% block content %}
<!-- Bootstrap Icons are already in base, so no extra link needed -->

<style>
  /* Page header – matches dashboard */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 1.5rem 0 2rem 0;
  }
  .page-title {
    font-size: 2rem;
    font-weight: 700;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .page-title i {
    color: #f97316;
    font-size: 2rem;
    background: white;
    padding: 0.5rem;
    border-radius: 18px;
    box-shadow: 0 4px 12px rgba(249,115,22,0.2);
  }

  /* Card styling */
  .edit-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.02);
    overflow: hidden;
  }
  .card-header-custom {
    padding: 1.5rem 2rem;
    background: white;
    border-bottom: 1px solid #f1f4f8;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .card-header-custom h4 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #0f172a;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .card-header-custom i {
    color: #f97316;
    background: rgba(249,115,22,0.1);
    padding: 0.5rem;
    border-radius: 14px;
  }

  /* Form table */
  .table-responsive {
    padding: 1.5rem 2rem;
  }
  .table {
    margin-bottom: 0;
    min-width: 600px;
  }
  .table thead th {
    background: #f8fafc;
    color: #0f172a;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom: 1px solid #e2e8f0;
    padding: 1rem;
  }
  .table td {
    padding: 1rem;
    vertical-align: middle;
    border-color: #e2e8f0;
  }

  /* Form field styling */
  .form-control, .form-select {
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 0.6rem 1rem;
    font-size: 0.95rem;
    transition: all 0.2s;
  }
  .form-control:focus, .form-select:focus {
    border-color: #f97316;
    outline: none;
    box-shadow: 0 0 0 3px rgba(249,115,22,0.1);
  }

  /* Buttons */
  .btn-orange {
    background: #f97316;
    color: white;
    border: none;
    border-radius: 40px;
    padding: 0.5rem 1.8rem;
    font-weight: 500;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-orange:hover {
    background: #e36209;
  }
  .btn-outline-secondary-custom {
    border: 1px solid #e2e8f0;
    color: #334155;
    background: white;
    border-radius: 40px;
    padding: 0.5rem 1.8rem;
    font-weight: 500;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .btn-outline-secondary-custom:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }

  .action-buttons {
    display: flex;
    gap: 0.75rem;
    justify-content: flex-end;
  }
</style>

<div class="container-fluid px-4">
  <!-- Header -->
  <div class="page-header">
    <h2 class="page-title">
      <i class="bi bi-pencil"></i> Edit Scenario
    </h2>
  </div>

  <!-- Edit Card -->
  <div class="edit-card">
    <div class="card-header-custom">
      <i class="bi bi-pencil-fill"></i>
      <h4>{{ scenario.title }}</h4>
    </div>

    <div class="table-responsive">
      <form method="POST">
        {% csrf_token %}

        <table class="table align-middle">
          <thead>
            <tr>
              <th>Title</th>
              <th>Description</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>{{ form.title }}</td>
              <td>{{ form.description }}</td>
              <td>{{ form.priority }}</td>
              <td>{{ form.status }}</td>
              <td>
                <div class="action-buttons">
                  <button type="submit" class="btn-orange">
                    <i class="bi bi-save"></i> Update
                  </button>
                  <a href="{% url 'dashboard:tester_scenarios' scenario.project.id %}" 
                     class="btn-outline-secondary-custom">
                    <i class="bi bi-x"></i> Cancel
                  </a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </form>
    </div>
  </div>
</div>
{% endblock %}
