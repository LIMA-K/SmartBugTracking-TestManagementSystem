{% extends "base_dashboard.html" %}
{% load static %}

{% block content %}
<!-- Font Awesome is already in base, but we include a fallback -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
  /* Ensure the content area takes full height for vertical centering */
  .content-wrapper {
    min-height: calc(100vh - 120px); /* adjust based on your header/padding */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  /* Message card – matches dashboard card style */
  .message-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
    border: 1px solid rgba(0,0,0,0.02);
    padding: 3rem 2.5rem;
    max-width: 600px;
    text-align: center;
    transition: all 0.2s;
  }
  .message-card:hover {
    box-shadow: 0 20px 35px -8px rgba(249,115,22,0.1);
    border-color: rgba(249,115,22,0.2);
  }

  /* Icon */
  .message-icon {
    width: 100px;
    height: 100px;
    background: rgba(249,115,22,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: #f97316;
    margin: 0 auto 1.5rem;
  }

  /* Heading */
  .message-card h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 1rem;
  }

  /* Text */
  .message-card p {
    color: #475569;
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 1rem;
  }

  /* Logout button – matches orange outline style */
  .btn-outline-orange {
    border: 1px solid #f97316;
    color: #f97316;
    background: transparent;
    border-radius: 40px;
    padding: 0.7rem 2.5rem;
    font-weight: 500;
    font-size: 1rem;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    text-decoration: none;
  }
  .btn-outline-orange:hover {
    background: #f97316;
    color: white;
  }

  /* Subtle divider */
  .divider {
    width: 80px;
    height: 3px;
    background: #f97316;
    opacity: 0.3;
    margin: 2rem auto 1.5rem;
    border-radius: 10px;
  }
</style>

<div class="container-fluid px-4">
  <div class="content-wrapper">
    <div class="message-card">
      <!-- Icon -->
      <div class="message-icon">
        <i class="fas fa-folder-open"></i>
      </div>

      <!-- Heading -->
      <h1>No Project Assigned</h1>

      <!-- Message -->
      <p>
        Your account is active, but the administrator has not assigned any project yet.
      </p>
      <p class="text-muted">
        Please contact the admin or wait for project assignment.
      </p>

      <!-- Decorative divider -->
      <div class="divider"></div>

      <!-- Logout button -->
      <a href="{% url 'logout' %}" class="btn-outline-orange">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </div>
  </div>
</div>
{% endblock %}
